name: Portable host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build portable runtime with sanitizers
        run: cmake -S . -B build/ci -DRNBO_S3_SANITIZERS=ON && cmake --build build/ci --parallel 2 && ctest --test-dir build/ci --output-on-failure
      - name: Validate host protocols and patch layout
        run: |
          python -m unittest discover -s host/clients -v
          python -m unittest discover -s host/studio -p 'test_*.py' -v
          python -m unittest discover -s tests/visual -v
          python -m unittest discover -s tests/dynamic -v
          python -m unittest discover -s tests/player -p 'test_*.py' -v
          python -m unittest discover -s host/compiler -v
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check public object status snapshot
        run: |
          python tools/build_object_status.py --check
          node --check site/app.js
          node --check host/studio/web/app.js
          node --test host/studio/test_web.mjs
      - name: Check exporter source and optional licensed frontend tests
        run: |
          node --check host/export/patcher.mjs
          node --test host/export/test_*.mjs
      # Real exports require the user's local licensed RNBO installation.
      # These checks do not claim an ESP32 build or hardware qualification.
