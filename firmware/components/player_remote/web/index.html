<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>RNBO Player</title>
<style>
:root{color-scheme:light;font:16px system-ui;background:#fff;color:#111}body{max-width:1100px;margin:0 auto;padding:28px}header{padding-bottom:20px;border-bottom:1px solid #e7ebef}h1{font-size:1.7rem;margin:8px 0}p{line-height:1.5;color:#737d88}code{overflow-wrap:anywhere;font-size:.75rem;color:#929ba5}#status{min-height:1.6em}#params{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 56px}article{padding:24px 0}label{font-size:1.1rem;font-weight:650}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px 0}.limits{display:flex;justify-content:space-between;flex-basis:100%;color:#929ba5;font-size:1rem}input[type=range]{appearance:none;-webkit-appearance:none;flex:1 0 100%;width:100%;height:32px;margin:0;background:transparent;touch-action:pan-y;--fill:0%}input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:12px;background:linear-gradient(to right,#258de8 var(--fill),#e7ebef var(--fill))}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:24px;height:24px;margin-top:-8px;border:5px solid #258de8;border-radius:50%;background:#fff}input[type=range]::-moz-range-track{height:8px;background:#e7ebef;border-radius:12px}input[type=range]::-moz-range-progress{height:8px;background:#258de8;border-radius:12px}input[type=range]::-moz-range-thumb{width:14px;height:14px;border:5px solid #258de8;border-radius:50%;background:white}input[type=range]:focus-visible{outline:2px solid #258de8;outline-offset:3px}input[type=number],select{order:3;box-sizing:border-box;width:120px;background:#fff;color:#111;border:1px solid #d9dfe5;border-radius:6px;font:inherit;padding:8px 10px}button{font:inherit;background:#258de8;color:#fff;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}small,footer{color:#929ba5}footer{padding-top:24px;font-size:.85rem;line-height:1.5}input:disabled,select:disabled{opacity:.45}@media(max-width:650px){body{padding:20px}#params{grid-template-columns:1fr;gap:0}article{padding:22px 0}}
</style>
<header><small>RNBO ESP32 · PARAMETERS</small><h1 id="patch">Connecting…</h1><div id="board"></div><p id="status" role="status">Reading the player.</p><button id="retry" hidden>Reconnect</button></header><main id="params"></main><footer>Changes apply to the running patch. Pause/Resume and package loading remain in Studio. Use this page on your trusted local network.</footer>
<script>
'use strict';
let schema=null,rows=[],busy=false,loading=false,writing=false,serial=0;
const continuous=new Map(),discrete=[];
const $=id=>document.getElementById(id);
function status(text,bad=false){$('status').textContent=text;$('status').style.color=bad?'#b43a3a':'#737d88';}
async function request(path,options={}){const r=await fetch(path,{cache:'no-store',...options});let body;try{body=await r.json();}catch{throw Error('Player connection interrupted');}if(!r.ok)throw Error(body.error||`Player replied ${r.status}`);return body;}
function paint(slider){slider.style.setProperty('--fill',`${Number(slider.value)*100}%`);}
function enqueue(p,value,normalized,ordered=false){const u={id:p.id,value,normalized};if(ordered){if(discrete.length>=32){status('Too many pending changes; wait a moment.',true);return;}discrete.push(u);}else continuous.set(p.id,u);}
function enabled(value){for(const r of rows){r.slider.disabled=!value;r.number.disabled=!value;if(r.select)r.select.disabled=!value;}}
async function load(){if(loading)return;loading=true;schema=null;serial++;continuous.clear();discrete.length=0;rows=[];$('params').replaceChildren();$('retry').hidden=true;
try{const s=await request('/api/schema');if(!s.valid)throw Error('Patch changed while loading; reconnect.');schema=s;$('patch').textContent=s.patch||'No patch loaded';$('board').textContent=`Board ${s.device_id} · ${location.hostname} · OSC ${s.osc_port}`;
for(const p of s.parameters){const a=document.createElement('article'),label=document.createElement('label');label.textContent=p.name+(p.unit?` (${p.unit})`:'');a.append(label);
const row=document.createElement('div');row.className='row';const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=1;slider.step='any';slider.setAttribute('aria-label',p.name+' normalized');
const number=document.createElement('input');number.type='number';number.min=p.min;number.max=p.max;number.step='any';number.setAttribute('aria-label',p.name+' value');row.append(slider,number);a.append(row);
const code=document.createElement('code');code.textContent='/rnbo/inst/0/params/'+p.id;a.append(code);let select=null;
if(p.enum_values){select=document.createElement('select');select.setAttribute('aria-label',p.name+' choice');for(const v of p.enum_values){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o);}row.append(select);number.readOnly=true;select.addEventListener('change',()=>enqueue(p,select.value,false,true));}
const limits=document.createElement('div');limits.className='limits';for(const value of [p.min,p.max]){const span=document.createElement('span');span.textContent=String(value);limits.append(span);}row.append(limits);
let held=false;slider.addEventListener('pointerdown',()=>held=true);for(const ev of ['pointerup','pointercancel','blur'])slider.addEventListener(ev,()=>held=false);
slider.addEventListener('input',()=>{paint(slider);enqueue(p,Number(slider.value),true);});number.addEventListener('change',()=>{if(number.readOnly)return;const value=Number(number.value);if(number.value!==''&&Number.isFinite(value))enqueue(p,value,false,true);});
$('params').append(a);rows.push({p,slider,number,select,held:()=>held});}
enabled(false);await poll();}catch(e){status(e.message,true);$('retry').hidden=false;}finally{loading=false;}}
async function poll(){if(busy||!schema||document.hidden)return;busy=true;const current=serial;
try{const v=await request('/api/values');if(current!==serial)return;if(v.generation!==schema.generation){setTimeout(load,0);return;}
enabled(v.playing&&!v.maintenance);status(v.maintenance?'Player is installing or configuring.':v.playing?`Live · ${v.dropped} dropped updates · ${v.rejected} rejected requests`:'Paused — resume in Studio to change parameters.');
for(const r of rows){const x=v.values[r.p.index];if(!x)continue;if(!r.held()&&document.activeElement!==r.slider&&!continuous.has(r.p.id)){r.slider.value=x[1];paint(r.slider);}if(document.activeElement!==r.number)r.number.value=Number(x[0].toPrecision(7));if(r.select&&document.activeElement!==r.select)r.select.value=r.p.enum_values[Math.round(x[0])]??'';}
}catch(e){enabled(false);status(e.message,true);$('retry').hidden=false;}finally{busy=false;}}
async function flush(){if(writing||!schema||document.hidden)return;const ordered=discrete.length>0;const updates=discrete.splice(0,8);if(!updates.length){for(const [id,u]of continuous){updates.push(u);continuous.delete(id);if(updates.length===8)break;}}if(!updates.length)return;const gen=schema.generation;let body=JSON.stringify({generation:gen,updates});while(new TextEncoder().encode(body).length>2048&&updates.length>1){const u=updates.pop();if(ordered)discrete.unshift(u);else if(!continuous.has(u.id))continuous.set(u.id,u);body=JSON.stringify({generation:gen,updates});}writing=true;
try{await request('/api/parameter',{method:'POST',headers:{'Content-Type':'application/json','X-RNBO-Control':schema.token},body});}
catch(e){continuous.clear();discrete.length=0;status(e.message,true);}finally{writing=false;}}
$('retry').addEventListener('click',load);document.addEventListener('visibilitychange',()=>{continuous.clear();discrete.length=0;if(!document.hidden)poll();});
setInterval(poll,200);setInterval(flush,20);load();
</script></html>
